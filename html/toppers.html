<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../js/theme.js"></script>
    <title>Toppers &amp; Results | Sagar Classes</title>
    
    <link rel="icon" href="../images/logo.jpeg">

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="../css/style.css">

  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>

<div class="app-container">

  <script src="../js/layout.js" data-part="nav"></script>

  <main class="main-content">

            <!-- Notice Ticker -->
            <div class="notice-card sticky-notice">
                <span class="notice-tag animate-bounce">
                    <i class="ri-megaphone-fill" style="color: #fff;"></i>
                    NOTICE
                </span>
                <div class="ticker">
                    <span class="ticker-text">
                        🎓 Admissions open for 2026-27 academic year! Enroll now. 
                        &nbsp; · &nbsp; 
                        📝 Unit Test scheduled for Class 10 on 1st September 2026. 
                        &nbsp; · &nbsp; 
                        🏆 Congratulations to all Board toppers of the 2025-26 batch! 
                        &nbsp; · &nbsp; 
                        📅 Parent-Teacher Meeting on 10th September 2026 at 10:00 AM.
                    </span>
                </div>
            </div>

            <!-- Toppers Section -->
            <section id="toppers" class="view active">
                <h2 class="section-title">
                    <i class="ri-award-fill" style="color: #fbbf24; filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.6));"></i>
                    Academic Toppers &amp; Hall of Fame
                </h2>

                <div id="toppersContainer"></div>

            </section>

        </main>

    </div>

<script src="../js/layout.js" data-part="footer"></script>

<script src="../js/store.js" defer></script>
<script src="../js/script.js" defer></script>
</body>
</html>
